name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Asset validation (deterministic regeneration, byte diff)
        run: npm run assets -- --check

      - name: Asset stats + size budget
        run: npm run assets -- --stats

      - name: Unit tests + headless full-progression simulation (power-curve gate)
        run: |
          set -o pipefail
          npx vitest run --reporter=basic 2>&1 | tee /tmp/vitest.log
          grep -E "Test Files|Tests " /tmp/vitest.log || true

      - name: Build
        run: npm run build

      - name: Bundle size guard (2.0 MB cap)
        run: |
          SIZE=$(du -cb dist/assets/*.js | tail -1 | cut -f1)
          echo "bundle js bytes: $SIZE"
          if [ "$SIZE" -gt 2097152 ]; then echo "BUNDLE OVER BUDGET"; exit 1; fi
          gzip -c dist/assets/*.js | wc -c

      - name: Browser QA (Playwright, real Chromium via npm binary)
        run: |
          node tools/ensure-chromium.mjs
          npx playwright test
